prometheus:
  prometheusSpec:
    retention: 30d
    
    # Prometheus configuration for /prometheus path
    externalUrl: "http://localhost:9090/prometheus"
    routePrefix: /prometheus
    
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ebs-gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 4Gi

grafana:
  enabled: true
  adminPassword: changeme123
  
  # Grafana configuration for /grafana path
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      serve_from_sub_path: true
  
  persistence:
    enabled: true
    storageClassName: ebs-gp3
    size: 10Gi
  
  # Disable Grafana's own ingress - we use monitoring-ingress.yaml instead
  ingress:
    enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ebs-gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
