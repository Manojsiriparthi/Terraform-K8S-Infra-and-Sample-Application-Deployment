# Kibana Configuration
replicas: 1

elasticsearchHosts: "http://elasticsearch-master:9200"

# Service configuration
service:
  type: LoadBalancer
  port: 5601

# Resource limits
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# Health checks
healthCheckPath: "/api/status"

# Kibana configuration
kibanaConfig:
  kibana.yml: |
    server.name: kibana
    server.host: "0.0.0.0"
    elasticsearch.hosts: [ "http://elasticsearch-master:9200" ]
    
    # Default index patterns
    kibana.defaultAppId: "discover"
    
    # Logging
    logging.dest: stdout
    logging.silent: false
    logging.quiet: false
    logging.verbose: false

# Persistent storage
persistence:
  enabled: false

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "5601"
