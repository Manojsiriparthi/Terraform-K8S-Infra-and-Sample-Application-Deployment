# Kibana Configuration
replicas: 1

elasticsearchHosts: "http://elasticsearch-master:9200"

# Completely disable security - no credentials needed
protocol: http

# Disable problematic lifecycle hooks
lifecycle:
  preStop:
    exec:
      command: ["/bin/bash", "-c", "sleep 20"]

# Disable pre-install test that tries to create ES token
tests:
  enabled: false

# Skip token creation in pre-install hook
extraEnvs:
  - name: ELASTICSEARCH_SERVICEACCOUNTTOKENS_ENABLED
    value: "false"
  - name: ELASTICSEARCH_USERNAME
    value: ""
  - name: ELASTICSEARCH_PASSWORD
    value: ""

# Service configuration
service:
  type: ClusterIP  # Changed from LoadBalancer - will use Ingress instead
  port: 5601

# Resource limits (reduced for t3.medium nodes)
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

# Health checks
healthCheckPath: "/api/status"

# Kibana configuration
kibanaConfig:
  kibana.yml: |
    server.name: kibana
    server.host: "0.0.0.0"
    server.basePath: "/kibana"
    server.rewriteBasePath: true
    elasticsearch.hosts: [ "http://elasticsearch-master:9200" ]
    
    # Disable security (matching Elasticsearch config)
    xpack.security.enabled: false
    elasticsearch.ssl.verificationMode: none
    
    # Default index patterns
    kibana.defaultAppId: "discover"
    
    # Logging
    logging.dest: stdout
    logging.silent: false
    logging.quiet: false
    logging.verbose: false

# Persistent storage
persistence:
  enabled: false

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "5601"
