# ============================================================================
# GATEWAY API ROUTES - HELM TEMPLATE
# Only frontend exposed publicly, backend accessed via frontend proxy
# ============================================================================

---
# Frontend HTTPRoute (public access to UI)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.frontend.name }}-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: public-gateway
    namespace: {{ .Values.namespace }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ .Values.frontend.name }}-service
      port: {{ .Values.frontend.service.port }}
      weight: 100

