# ============================================================================
# ShopEase Application Helm Chart Values
# ============================================================================

# Global settings
global:
  projectName: shopease
  environment: production

# Namespace configuration
namespace:
  application: application
  monitoring: monitoring
  production: production

# Image configuration
images:
  frontend:
    repository: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/shopease-frontend
    tag: latest
    pullPolicy: Always
  backend:
    repository: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/shopease-backend
    tag: latest
    pullPolicy: Always
  database:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 2
  nodeSelector:
    role: public
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /
      alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

# Backend configuration
backend:
  enabled: true
  replicaCount: 2
  nodeSelector:
    role: private
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    type: ClusterIP
    port: 5000
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /health
      alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Database configuration
database:
  enabled: true
  nodeSelector:
    role: private
  storage:
    className: ebs-gp3
    size: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  credentials:
    username: shopease
    password: shopease123
    database: shopease

# RBAC configuration
rbac:
  enabled: true
  createRoles: true

# Network policies
networkPolicies:
  enabled: true

# Monitoring
monitoring:
  prometheus:
    enabled: true
  grafana:
    enabled: true
    adminPassword: changeme123
  elasticsearch:
    enabled: true
    replicas: 2
    storage:
      size: 50Gi
  kibana:
    enabled: true
    service:
      type: LoadBalancer
