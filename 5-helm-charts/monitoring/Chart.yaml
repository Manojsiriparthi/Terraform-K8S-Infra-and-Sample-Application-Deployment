apiVersion: v2
name: shopease-monitoring
description: ShopEase Monitoring Stack (Prometheus, Grafana, Elasticsearch, Kibana)
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - monitoring
  - prometheus
  - grafana
  - elasticsearch
  - kibana
maintainers:
  - name: DevOps Team
    email: devops@shopease.com
dependencies:
  - name: kube-prometheus-stack
    version: "~54.0.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: elasticsearch
    version: "~8.5.1"
    repository: https://helm.elastic.co
    condition: elasticsearch.enabled
  - name: kibana
    version: "~8.5.1"
    repository: https://helm.elastic.co
    condition: kibana.enabled
