---
# Internal ALB - Monitoring (Private)
# Shares the SAME ALB as backend services using group.name
# Provides access to Grafana and Prometheus dashboards

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  annotations:
    # ALB Configuration
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: backend-monitoring  # SAME ALB as backend
    alb.ingress.kubernetes.io/group.order: '2'  # Monitoring evaluated second
    
    # Health Check
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    
    # Ports
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    
    # Tags
    alb.ingress.kubernetes.io/tags: Environment=production,Team=monitoring,Application=observability
  
  labels:
    app: monitoring

spec:
  ingressClassName: alb
  
  rules:
    - http:
        paths:
          # Grafana Dashboard
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          
          # Prometheus Metrics
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
          
          # Alertmanager (optional)
          - path: /alertmanager
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  number: 9093
