---
# External ALB - Frontend (Internet-facing)
# Exposes frontend to internet users with path-based routing

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: application
  annotations:
    # ALB Configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: frontend-public
    
    # Health Check
    alb.ingress.kubernetes.io/healthcheck-path: /_healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    
    # Ports
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    
    # Optional: HTTPS (uncomment and add certificate ARN)
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:region:account:certificate/xxx
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
    
    # Tags
    alb.ingress.kubernetes.io/tags: Environment=production,Team=frontend,Application=shopease
  
  labels:
    app: frontend
    tier: web

spec:
  ingressClassName: alb
  
  rules:
    - http:
        paths:
          # Root path
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          
          # Home page
          - path: /home
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          
          # Shopping cart
          - path: /cart
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          
          # Payment/checkout
          - path: /payment
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          
          # User profile
          - path: /profile
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          
          # Product pages
          - path: /product
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          
          # Static assets
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
