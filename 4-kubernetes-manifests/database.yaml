---
# PostgreSQL Database for Orders, Customers, Products
# Redis is for cart cache (temporary data)
# PostgreSQL is for persistent data (orders, customers, products)

---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: application
type: Opaque
stringData:
  POSTGRES_USER: shopease
  POSTGRES_PASSWORD: shopease123  # Change in production!
  POSTGRES_DB: shopease

---
# PostgreSQL ConfigMap (Init SQL)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: application
data:
  init.sql: |
    -- Create tables for e-commerce application
    
    -- Products table
    CREATE TABLE IF NOT EXISTS products (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        description TEXT,
        price_usd_currency_code VARCHAR(3) DEFAULT 'USD',
        price_usd_units BIGINT NOT NULL,
        price_usd_nanos INTEGER NOT NULL,
        picture VARCHAR(500),
        categories TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Customers table
    CREATE TABLE IF NOT EXISTS customers (
        id SERIAL PRIMARY KEY,
        email VARCHAR(255) UNIQUE NOT NULL,
        first_name VARCHAR(100),
        last_name VARCHAR(100),
        phone VARCHAR(20),
        address_street VARCHAR(255),
        address_city VARCHAR(100),
        address_state VARCHAR(100),
        address_country VARCHAR(100),
        address_zip VARCHAR(20),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Orders table
    CREATE TABLE IF NOT EXISTS orders (
        id SERIAL PRIMARY KEY,
        customer_id INTEGER REFERENCES customers(id),
        order_id VARCHAR(100) UNIQUE NOT NULL,
        email VARCHAR(255) NOT NULL,
        total_amount_currency_code VARCHAR(3) DEFAULT 'USD',
        total_amount_units BIGINT NOT NULL,
        total_amount_nanos INTEGER NOT NULL,
        shipping_cost_currency_code VARCHAR(3) DEFAULT 'USD',
        shipping_cost_units BIGINT NOT NULL,
        shipping_cost_nanos INTEGER NOT NULL,
        shipping_address_street VARCHAR(255),
        shipping_address_city VARCHAR(100),
        shipping_address_state VARCHAR(100),
        shipping_address_country VARCHAR(100),
        shipping_address_zip VARCHAR(20),
        shipping_tracking_id VARCHAR(100),
        status VARCHAR(50) DEFAULT 'pending',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Order items table
    CREATE TABLE IF NOT EXISTS order_items (
        id SERIAL PRIMARY KEY,
        order_id INTEGER REFERENCES orders(id),
        product_id VARCHAR(100) NOT NULL,
        quantity INTEGER NOT NULL,
        price_currency_code VARCHAR(3) DEFAULT 'USD',
        price_units BIGINT NOT NULL,
        price_nanos INTEGER NOT NULL
    );

    -- Insert sample products
    INSERT INTO products (name, description, price_usd_units, price_usd_nanos, picture, categories) VALUES
    ('Vintage Typewriter', 'Vintage typewriter for the modern writer', 67, 990000000, '/static/img/products/typewriter.jpg', 'vintage'),
    ('Vintage Camera Lens', 'Vintage camera lens for photography enthusiasts', 12, 490000000, '/static/img/products/camera-lens.jpg', 'photography,vintage'),
    ('Home Barista Kit', 'Complete coffee brewing kit for home baristas', 124, 0, '/static/img/products/barista-kit.jpg', 'kitchen'),
    ('Terrarium', 'Small glass terrarium with succulents', 36, 450000000, '/static/img/products/terrarium.jpg', 'gardening'),
    ('Film Camera', 'Vintage film camera in working condition', 2295, 0, '/static/img/products/film-camera.jpg', 'photography,vintage'),
    ('Vintage Record Player', 'Refurbished vintage record player', 65, 500000000, '/static/img/products/record-player.jpg', 'music,vintage'),
    ('Metal Camping Mug', 'Durable metal camping mug', 24, 330000000, '/static/img/products/camp-mug.jpg', 'camping'),
    ('City Bike', 'Vintage-style city bicycle', 789, 500000000, '/static/img/products/city-bike.jpg', 'cycling'),
    ('Air Plant', 'Low-maintenance air plant', 12, 300000000, '/static/img/products/air-plant.jpg', 'gardening')
    ON CONFLICT DO NOTHING;

    -- Create indexes
    CREATE INDEX IF NOT EXISTS idx_orders_customer_id ON orders(customer_id);
    CREATE INDEX IF NOT EXISTS idx_orders_email ON orders(email);
    CREATE INDEX IF NOT EXISTS idx_orders_status ON orders(status);
    CREATE INDEX IF NOT EXISTS idx_orders_created_at ON orders(created_at);
    CREATE INDEX IF NOT EXISTS idx_order_items_order_id ON order_items(order_id);
    CREATE INDEX IF NOT EXISTS idx_products_categories ON products(categories);

---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: application
  labels:
    app: postgres
    tier: database
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      tier: database
  
  # Persistent volume claim template
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ebs-gp3
        resources:
          requests:
            storage: 20Gi
  
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      # Run on database nodes (with taint)
      nodeSelector:
        role: database
      
      tolerations:
        - key: workload
          operator: Equal
          value: database
          effect: NoSchedule
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          
          envFrom:
            - secretRef:
                name: postgres-secret
          
          # Persistent volume mount
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          
          # Resource limits
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          
          # Liveness probe
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - shopease
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Readiness probe
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - shopease
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      
      volumes:
        - name: init-script
          configMap:
            name: postgres-init-script

---
# PostgreSQL Service (ClusterIP - Internal Only)
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: application
  labels:
    app: postgres
    tier: database
spec:
  type: ClusterIP
  selector:
    app: postgres
    tier: database
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
