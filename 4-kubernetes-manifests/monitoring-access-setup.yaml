# ============================================================================
# MONITORING ACCESS SETUP — Grafana Orgs + Kibana Spaces
# ============================================================================
# Run these steps ONCE after the monitoring stack is deployed.
# Each app team manages their own users after initial setup.
#
# GRAFANA SETUP (run by platform-team after deploy):
#   1. Create org per app team
#   2. Add Prometheus datasource scoped to that app's namespace
#   3. Create initial admin user for that team
#   4. App team then manages their own users inside their org
#
# KIBANA SETUP (run by platform-team after deploy):
#   1. Create space per app team
#   2. Create index pattern scoped to that app's logs
#   3. Create initial user for that team
#   4. App team then manages their own users inside their space
#
# INTERNAL ALB ACCESS:
#   All /appN/* paths are on the internal ALB — not reachable from internet.
#   Users must be on VPN or inside the VPC to reach these URLs.
#   Even if someone reaches the URL, they still need valid credentials.
# ============================================================================

---
# ── GRAFANA SETUP JOBS ────────────────────────────────────────────────────────
# These Kubernetes Jobs run the Grafana API calls to set up orgs and users.
# Run once after monitoring stack is deployed.

# Job: Create Grafana Org for app1-team
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-setup-app1-org
  namespace: monitoring
  labels:
    app: grafana-setup
    team: app1
  annotations:
    # Run manually: kubectl create -f monitoring-access-setup.yaml
    description: "Creates Grafana Org 2 for app1-team with scoped Prometheus datasource"
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        node-type: general
      containers:
        - name: grafana-setup
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              set -e
              GRAFANA_URL="http://monitoring-grafana.monitoring.svc.cluster.local"
              ADMIN_PASS="${GRAFANA_ADMIN_PASSWORD}"

              echo "=== Creating app1 Organization ==="
              ORG_RESPONSE=$(curl -sf -X POST \
                -H "Content-Type: application/json" \
                -u "admin:${ADMIN_PASS}" \
                "${GRAFANA_URL}/api/orgs" \
                -d '{"name": "app1-org"}')
              echo "Org created: ${ORG_RESPONSE}"
              APP1_ORG_ID=$(echo "${ORG_RESPONSE}" | grep -o '"orgId":[0-9]*' | grep -o '[0-9]*')
              echo "app1 Org ID: ${APP1_ORG_ID}"

              echo "=== Switching to app1 org context ==="
              curl -sf -X POST \
                -H "Content-Type: application/json" \
                -u "admin:${ADMIN_PASS}" \
                "${GRAFANA_URL}/api/user/using/${APP1_ORG_ID}"

              echo "=== Adding Prometheus datasource for app1 (namespace=app1 filter) ==="
              curl -sf -X POST \
                -H "Content-Type: application/json" \
                -u "admin:${ADMIN_PASS}" \
                "${GRAFANA_URL}/api/datasources" \
                -d "{
                  \"name\": \"Prometheus-app1\",
                  \"type\": \"prometheus\",
                  \"url\": \"http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090\",
                  \"access\": \"proxy\",
                  \"isDefault\": true,
                  \"jsonData\": {
                    \"httpMethod\": \"POST\",
                    \"customQueryParameters\": \"namespace=app1\"
                  }
                }"

              echo "=== Creating app1-admin user ==="
              curl -sf -X POST \
                -H "Content-Type: application/json" \
                -u "admin:${ADMIN_PASS}" \
                "${GRAFANA_URL}/api/admin/users" \
                -d "{
                  \"name\": \"App1 Admin\",
                  \"email\": \"app1-admin@shopease.com\",
                  \"login\": \"app1-admin\",
                  \"password\": \"${APP1_GRAFANA_PASSWORD}\",
                  \"OrgId\": ${APP1_ORG_ID}
                }"

              echo "=== Assigning app1-admin as Org Admin ==="
              APP1_USER_ID=$(curl -sf \
                -u "admin:${ADMIN_PASS}" \
                "${GRAFANA_URL}/api/users/lookup?loginOrEmail=app1-admin" \
                | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
              curl -sf -X PATCH \
                -H "Content-Type: application/json" \
                -u "admin:${ADMIN_PASS}" \
                "${GRAFANA_URL}/api/orgs/${APP1_ORG_ID}/users/${APP1_USER_ID}" \
                -d '{"role": "Admin"}'

              echo "=== app1 Grafana setup complete ==="
              echo "app1-team can now login at: internal-alb/app1/grafana"
              echo "Username: app1-admin"
              echo "They can create additional users inside their org"

          env:
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: admin-password
            - name: APP1_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app1-grafana-secret
                  key: password

