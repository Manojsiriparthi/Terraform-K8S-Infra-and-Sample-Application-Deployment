---
# ── SECRETS ───────────────────────────────────────────────────────────────────
# Secrets are NOT defined here.
# They are created automatically by External Secrets Operator
# from AWS Secrets Manager — see monitoring-credentials.yaml.
#
# Apply monitoring-credentials.yaml BEFORE running these setup jobs.
# The jobs read passwords from the Kubernetes Secrets that ESO creates.
