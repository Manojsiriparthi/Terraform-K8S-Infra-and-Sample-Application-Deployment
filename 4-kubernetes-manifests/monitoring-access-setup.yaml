---
# ── KIBANA SETUP JOBS ─────────────────────────────────────────────────────────

# Job: Create Kibana space for app1-team
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-setup-app1-space
  namespace: monitoring
  labels:
    app: kibana-setup
    team: app1
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        node-type: general
      containers:
        - name: kibana-setup
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              set -e
              KIBANA_URL="http://monitoring-kibana.monitoring.svc.cluster.local:5601"

              echo "=== Waiting for Kibana to be ready ==="
              until curl -sf "${KIBANA_URL}/kibana/api/status" > /dev/null; do
                echo "Waiting for Kibana..."
                sleep 5
              done

              echo "=== Creating app1 Kibana space ==="
              curl -sf -X POST \
                -H "Content-Type: application/json" \
                -H "kbn-xsrf: true" \
                "${KIBANA_URL}/kibana/api/spaces/space" \
                -d '{
                  "id": "app1",
                  "name": "App1 Logs",
                  "description": "Log space for app1-team — app1-logs-* indices only",
                  "initials": "A1",
                  "color": "#00BFB3"
                }'

              echo "=== Creating app1 index pattern in app1 space ==="
              curl -sf -X POST \
                -H "Content-Type: application/json" \
                -H "kbn-xsrf: true" \
                "${KIBANA_URL}/kibana/s/app1/api/index_patterns/index_pattern" \
                -d '{
                  "index_pattern": {
                    "title": "app1-logs-*",
                    "timeFieldName": "@timestamp"
                  }
                }'

              echo "=== app1 Kibana space setup complete ==="
              echo "app1-team accesses: internal-alb/app1/kibana"
              echo "They see ONLY app1-logs-* indices"

---
