# ============================================================================
# SECRETS AND CONFIGMAPS
# ============================================================================
# IMPORTANT: In production, use AWS Secrets Manager or External Secrets
# Operator instead of plain Kubernetes Secrets.
# These are base64-encoded values — NOT encrypted at rest unless KMS is used.
# KMS encryption is enabled on this cluster (see 1-infrastructure/modules/iam).
#
# Generate base64: echo -n "value" | base64
# ============================================================================

---
# Database credentials — used by backend and database pods
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: app1
  labels:
    app: shopease
    tier: database
type: Opaque
data:
  # echo -n "shopease" | base64
  POSTGRES_DB: c2hvcGVhc2U=
  # echo -n "shopease" | base64
  POSTGRES_USER: c2hvcGVhc2U=
  # echo -n "shopease123!" | base64  ← CHANGE IN PRODUCTION
  POSTGRES_PASSWORD: c2hvcGVhc2UxMjMh

---
# Same secret in app1-database namespace (database pods live here)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: app1-database
  labels:
    app: shopease
    tier: database
type: Opaque
data:
  POSTGRES_DB: c2hvcGVhc2U=
  POSTGRES_USER: c2hvcGVhc2U=
  POSTGRES_PASSWORD: c2hvcGVhc2UxMjMh

---
# Backend ConfigMap — non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: app1
  labels:
    app: shopease
    tier: backend
data:
  DATABASE_HOST: "postgres-service.app1-database.svc.cluster.local"
  DATABASE_PORT: "5432"
  FLASK_ENV: "production"
  LOG_LEVEL: "INFO"
  # Gunicorn settings
  WORKERS: "4"
  WORKER_TIMEOUT: "120"
  KEEPALIVE: "5"

---
# Frontend ConfigMap — nginx configuration with correct API proxy
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: app1
  labels:
    app: shopease
    tier: frontend
data:
  nginx.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # React Router — serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API calls to backend service
        location /api {
            proxy_pass http://backend-service.app1.svc.cluster.local:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        # Health check endpoint
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript
                   application/javascript application/json application/xml;
    }
