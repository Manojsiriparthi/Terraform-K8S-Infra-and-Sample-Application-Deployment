# ============================================================================
# NETWORK POLICIES — Fine-grained traffic control
# ============================================================================
# These supplement the namespace-level policies in 2-eks-addons/rbac.tf.
# They define WHICH pods can talk to WHICH pods at the pod-selector level.
# ============================================================================

---
# Allow frontend pods to call backend pods (within app1 namespace)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: app1
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
    - Ingress
  ingress:
    # From frontend pods in same namespace
    - from:
        - podSelector:
            matchLabels:
              tier: frontend
      ports:
        - port: 5000
          protocol: TCP
    # From Gateway controller (kube-system)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 5000
          protocol: TCP

---
# Allow backend pods to reach database (cross-namespace)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-database
  namespace: app1-database
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    # Only backend pods from app1 namespace can reach postgres
    - from:
        - namespaceSelector:
            matchLabels:
              app: app1
          podSelector:
            matchLabels:
              tier: backend
      ports:
        - port: 5432
          protocol: TCP

---
# Allow Prometheus to scrape backend metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-backend
  namespace: app1
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app: monitoring
      ports:
        - port: 5000
          protocol: TCP

---
# Allow Prometheus to scrape postgres-exporter metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-database
  namespace: app1-database
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app: monitoring
      ports:
        - port: 9187    # postgres-exporter metrics port
          protocol: TCP

---
# Allow backend egress to database only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress-policy
  namespace: app1
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL in app1-database namespace
    # namespace label is "app: app1" only (set in 2-eks-addons/rbac.tf)
    - to:
        - namespaceSelector:
            matchLabels:
              app: app1
      ports:
        - port: 5432
          protocol: TCP
