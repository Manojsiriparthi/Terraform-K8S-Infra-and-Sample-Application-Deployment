# ============================================================================
# MONITORING INGRESS - Shares ALB with Backend
# Path-based routing for all monitoring tools
# ============================================================================

---
# Monitoring Ingress (Shared ALB with Backend via group.name)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  labels:
    app: monitoring
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: backend-monitoring  # Share ALB with backend
    alb.ingress.kubernetes.io/group.order: '2'  # Monitoring routes evaluated second
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      # Grafana at /grafana
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: prometheus-grafana
            port:
              number: 80
      
      # Prometheus at /prometheus
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: prometheus-kube-prometheus-prometheus
            port:
              number: 9090
      
      # Kibana at /kibana
      - path: /kibana
        pathType: Prefix
        backend:
          service:
            name: kibana-kibana
            port:
              number: 5601
      
      # Elasticsearch at /elasticsearch
      - path: /elasticsearch
        pathType: Prefix
        backend:
          service:
            name: elasticsearch-master
            port:
              number: 9200
