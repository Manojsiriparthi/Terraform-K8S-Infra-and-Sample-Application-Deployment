# ============================================================================
# MONITORING CREDENTIALS — Secrets for Multi-Tenant Access
# ============================================================================
# Creates secrets for Grafana admin and team-specific access
# Each team gets their own credentials to access only their monitoring data
#
# USAGE:
# 1. Apply this file to create secrets
# 2. Run monitoring-access-setup.yaml to configure Grafana orgs
# 3. Share credentials with respective teams securely
#
# MULTI-TENANCY:
# - app1-team: Can only see metrics/logs from 'application' namespace
# - app2-team: Can only see metrics/logs from 'app2' namespace (future)
# - Platform team: Has admin access to all monitoring
# ============================================================================

---
# Grafana Admin Secret (Platform Team)
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
  labels:
    app: grafana
    managed-by: platform-team
type: Opaque
stringData:
  admin-password: "changeme-admin-password"  # CHANGE THIS IN PRODUCTION!

---
# App1 Team Grafana Secret
# App1 team uses this to login to their Grafana org
# They can only see metrics from 'application' namespace
apiVersion: v1
kind: Secret
metadata:
  name: app1-grafana-secret
  namespace: monitoring
  labels:
    app: grafana
    team: app1
    managed-by: platform-team
type: Opaque
stringData:
  password: "changeme-app1-password"  # CHANGE THIS IN PRODUCTION!

---
# App2 Team Grafana Secret (Future Application)
# When you deploy app2, this team will have access to app2 namespace only
apiVersion: v1
kind: Secret
metadata:
  name: app2-grafana-secret
  namespace: monitoring
  labels:
    app: grafana
    team: app2
    managed-by: platform-team
type: Opaque
stringData:
  password: "changeme-app2-password"  # CHANGE THIS IN PRODUCTION!
