# ============================================================================
# MONITORING CREDENTIALS — External Secrets Operator
# ============================================================================
# Pulls passwords from AWS Secrets Manager into Kubernetes Secrets.
# External Secrets Operator must be installed (add to 2-eks-addons if needed).
#
# STEP 1 — Create passwords in AWS Secrets Manager (run once by platform-team):
#
#   aws secretsmanager create-secret \
#     --name "/shopease/production/monitoring/grafana-admin" \
#     --secret-string '{"admin-password":"<strong-password-here>"}'
#
#   aws secretsmanager create-secret \
#     --name "/shopease/production/monitoring/app1-grafana" \
#     --secret-string '{"password":"<app1-password-here>"}'
#
#   aws secretsmanager create-secret \
#     --name "/shopease/production/monitoring/app2-grafana" \
#     --secret-string '{"password":"<app2-password-here>"}'
#
# STEP 2 — Apply this file. ExternalSecret resources pull from Secrets Manager
#          and create Kubernetes Secrets automatically.
#
# STEP 3 — Share app1 password with app1-devops securely (1Password, Vault, etc.)
#          After first login, app1-devops changes their password inside Grafana.
#
# PASSWORD ROTATION:
#   Update the secret in AWS Secrets Manager.
#   External Secrets Operator syncs every 1h (refreshInterval below).
#   Grafana picks up the new password on next login.
# ============================================================================

---
# ClusterSecretStore — tells External Secrets Operator how to connect to AWS
# One store for the whole cluster, reused by all ExternalSecret resources
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    managed-by: platform-team
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1          # change to your AWS region
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets

---
# ExternalSecret — Grafana platform admin password
# Syncs /shopease/production/monitoring/grafana-admin → grafana-admin-secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  labels:
    app: grafana
    managed-by: platform-team
spec:
  refreshInterval: 1h            # re-sync from Secrets Manager every hour
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret   # Kubernetes Secret name created/updated
    creationPolicy: Owner        # ESO owns this secret — deletes it if ExternalSecret is deleted
    template:
      type: Opaque
  data:
    - secretKey: admin-password  # key inside the Kubernetes Secret
      remoteRef:
        key: /shopease/production/monitoring/grafana-admin
        property: admin-password # key inside the AWS Secrets Manager JSON

---
# ExternalSecret — app1-team Grafana initial password
# app1-devops receives this password from platform-team
# After first login they change it inside Grafana (platform-team no longer knows it)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app1-grafana-credentials
  namespace: monitoring
  labels:
    app: grafana
    team: app1
    managed-by: platform-team
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app1-grafana-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: /shopease/production/monitoring/app1-grafana
        property: password

---
# ExternalSecret — app2-team Grafana initial password
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app2-grafana-credentials
  namespace: monitoring
  labels:
    app: grafana
    team: app2
    managed-by: platform-team
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app2-grafana-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: /shopease/production/monitoring/app2-grafana
        property: password
