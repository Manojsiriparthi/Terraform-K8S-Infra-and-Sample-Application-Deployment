# ============================================================================
# GATEWAY API - GatewayClass
# ============================================================================
# GatewayClass defines the type of Gateway (AWS ALB in this case)
# This is OPTIONAL - only needed if using Gateway API instead of Ingress
#
# Prerequisites:
# 1. Gateway API CRDs installed (via Terraform: enable_gateway_api = true)
# 2. AWS Load Balancer Controller installed (already done in 2-eks-addons)
#
# Gateway API is next-generation Ingress - more flexible and powerful
# Current setup uses Ingress (frontend-ingress-external.yaml, backend-ingress-internal.yaml)
# You can migrate to Gateway API in the future if needed
# ============================================================================

---
# GatewayClass for AWS ALB
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-alb
  labels:
    app: aws-load-balancer-controller
spec:
  controllerName: eks.amazonaws.com/aws-load-balancer-controller
  description: "AWS Application Load Balancer Gateway Class"
