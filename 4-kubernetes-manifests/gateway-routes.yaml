# ============================================================================
# GATEWAY API ROUTES
# Single public gateway - only frontend exposed
# Backend accessed internally through frontend Nginx proxy
# ============================================================================

---
# Frontend HTTPRoute (public access to UI)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: application
spec:
  parentRefs:
  - name: public-gateway
    namespace: application
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend-service
      port: 80
      weight: 100


