# ============================================================================
# RESOURCE QUOTAS AND LIMIT RANGES
# ============================================================================
# ResourceQuota  — caps total resource consumption per namespace
# LimitRange     — sets default requests/limits for pods that don't specify them
#
# Why both:
#   ResourceQuota prevents one team from consuming all cluster resources.
#   LimitRange ensures every pod has requests/limits set (required for HPA
#   and Karpenter to make correct scheduling decisions).
# ============================================================================

# ── APP1 NAMESPACE ────────────────────────────────────────────────────────────

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app1-quota
  namespace: app1
  labels:
    app: shopease
    managed-by: platform-team
spec:
  hard:
    # Compute
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    # Pods
    pods: "50"
    # Services
    services: "20"
    services.loadbalancers: "0"    # no direct LoadBalancer services — use Gateway API
    services.nodeports: "0"        # no NodePort — use ClusterIP only
    # Storage
    persistentvolumeclaims: "10"
    requests.storage: 100Gi
    # Config/Secrets
    configmaps: "20"
    secrets: "20"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: app1-limits
  namespace: app1
  labels:
    app: shopease
    managed-by: platform-team
spec:
  limits:
    # Default for containers that don't specify resources
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 50m
        memory: 64Mi
    # Pod-level limits
    - type: Pod
      max:
        cpu: "4"
        memory: 8Gi
    # PVC limits
    - type: PersistentVolumeClaim
      max:
        storage: 50Gi
      min:
        storage: 1Gi

# ── APP1-DATABASE NAMESPACE ───────────────────────────────────────────────────

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app1-database-quota
  namespace: app1-database
  labels:
    app: shopease
    managed-by: platform-team
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "12"
    limits.memory: 24Gi
    pods: "10"
    services: "5"
    services.loadbalancers: "0"
    services.nodeports: "0"
    persistentvolumeclaims: "5"
    requests.storage: 200Gi    # more storage for database
    configmaps: "10"
    secrets: "5"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: app1-database-limits
  namespace: app1-database
  labels:
    app: shopease
    managed-by: platform-team
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 100m
        memory: 256Mi
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
      min:
        storage: 5Gi

# ── APP1-MONITORING NAMESPACE ─────────────────────────────────────────────────

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app1-monitoring-quota
  namespace: app1-monitoring
  labels:
    app: shopease
    managed-by: platform-team
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
    services: "10"
    services.loadbalancers: "0"
    services.nodeports: "0"
    configmaps: "20"
    secrets: "10"
