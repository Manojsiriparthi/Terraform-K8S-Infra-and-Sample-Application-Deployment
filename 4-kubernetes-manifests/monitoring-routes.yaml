# ============================================================================
# MONITORING GATEWAY ROUTES
# Single internal ALB with path-based routing for all monitoring tools
# Accessible only from VPC (DevOps team via bastion/VPN)
# ============================================================================

---
# Grafana HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
  - name: monitoring-gateway
    namespace: monitoring
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /grafana
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: prometheus-grafana
      port: 80
      weight: 100

---
