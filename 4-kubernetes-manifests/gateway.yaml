# ============================================================================
# GATEWAY API - Gateway Resources
# ============================================================================
# Gateway resources define load balancers (ALBs)
# This is OPTIONAL - only needed if using Gateway API instead of Ingress
#
# Current Setup: Uses Ingress resources
# - frontend-ingress-external.yaml (External ALB)
# - backend-ingress-internal.yaml (Internal ALB)
#
# Future Migration: Can replace Ingress with Gateway + HTTPRoute
# Gateway API provides more flexibility for advanced routing
# ============================================================================

---
# External Gateway for Frontend (Internet-facing ALB)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: frontend-gateway
  namespace: application
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/tags: Environment=production,Team=frontend
  labels:
    app: frontend
    tier: web
spec:
  gatewayClassName: aws-alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

---
# Internal Gateway for Backend (Private ALB)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: backend-gateway
  namespace: application
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/tags: Environment=production,Team=backend
  labels:
    app: backend
    tier: api
spec:
  gatewayClassName: aws-alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

---
