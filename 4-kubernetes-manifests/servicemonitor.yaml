# ============================================================================
# SERVICEMONITOR — Prometheus Scrape Configuration
# ============================================================================
# Tells Prometheus which services to scrape for metrics
# Works with Prometheus Operator installed via Terraform (2-eks-addons)
#
# MULTI-TENANCY:
# - Each ServiceMonitor is scoped to specific namespace
# - app1-team sees only 'application' namespace metrics
# - app2-team sees only 'app2' namespace metrics (future)
# ============================================================================

---
# ServiceMonitor for Backend Services
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-services-monitor
  namespace: application
  labels:
    app: backend
    release: kube-prometheus-stack  # Must match Prometheus operator label selector
spec:
  namespaceSelector:
    matchNames:
      - application  # Scrape ONLY application namespace
  selector:
    matchLabels:
      tier: backend
  endpoints:
    - port: grpc
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ServiceMonitor for Frontend
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend-monitor
  namespace: application
  labels:
    app: frontend
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - application
  selector:
    matchLabels:
      app: frontend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ServiceMonitor for PostgreSQL
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-monitor
  namespace: application
  labels:
    app: postgres
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - application
  selector:
    matchLabels:
      app: postgres
  endpoints:
    - port: postgres
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ServiceMonitor for Redis
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-monitor
  namespace: application
  labels:
    app: redis
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - application
  selector:
    matchLabels:
      app: redis-cart
  endpoints:
    - port: redis
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# PrometheusRule — Alerting Rules for Application
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: application-alerts
  namespace: application
  labels:
    app: application
    release: kube-prometheus-stack
spec:
  groups:
    - name: application.backend
      interval: 30s
      rules:
        - alert: BackendPodDown
          expr: up{namespace="application", tier="backend"} == 0
          for: 2m
          labels:
            severity: critical
            team: app1
          annotations:
            summary: "Backend pod is down in application namespace"
            description: "Pod {{ $labels.pod }} has been down for more than 2 minutes"

        - alert: HighErrorRate
          expr: |
            rate(http_requests_total{namespace="application", status=~"5.."}[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
            team: app1
          annotations:
            summary: "High error rate detected"
            description: "Error rate is above 5% for {{ $labels.service }}"

    - name: application.database
      interval: 60s
      rules:
        - alert: DatabaseDown
          expr: up{namespace="application", app="postgres"} == 0
          for: 2m
          labels:
            severity: critical
            team: app1
          annotations:
            summary: "PostgreSQL database is down"
            description: "Database has been unreachable for more than 2 minutes"

        - alert: DatabaseHighConnections
          expr: pg_stat_activity_count{namespace="application"} > 150
          for: 5m
          labels:
            severity: warning
            team: app1
          annotations:
            summary: "PostgreSQL connection count is high"
            description: "Connection count is {{ $value }}, threshold is 150"

    - name: application.redis
      interval: 60s
      rules:
        - alert: RedisDown
          expr: up{namespace="application", app="redis-cart"} == 0
          for: 2m
          labels:
            severity: critical
            team: app1
          annotations:
            summary: "Redis cache is down"
            description: "Redis has been unreachable for more than 2 minutes"
